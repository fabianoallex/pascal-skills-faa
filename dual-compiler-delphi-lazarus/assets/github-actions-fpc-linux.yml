# Starting point, not a drop-in final workflow. Copy this into
# .github/workflows/ and adjust it for your project.
#
# Pattern this follows (see the dual-compiler-delphi-lazarus skill's
# "CI: keep the YAML thin" section): put all Docker/FPC provisioning and
# test orchestration into a versioned script (tools/ci-test.sh — see the
# companion assets/ci-test.sh.example) that a developer can also run
# locally, rather than inlining apt-get/build commands here. Add more jobs
# the same way as the project grows (one script per deployable component).
#
# Delphi Community Edition can't build headless, so this only covers the
# FPC/Linux side. Delphi-side validation still depends on someone running
# the suite in the IDE.

name: FPC Linux tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-fpc-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # with:
        #   submodules: recursive   # uncomment if the project vendors dependencies as submodules

      - name: Run FPC/Linux test suite
        run: tools/ci-test.sh
